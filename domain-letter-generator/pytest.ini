[pytest]
# Testy generátoru dopisů. Kořen projektu si na sys.path přidává tests/conftest.py,
# `pythonpath` je pojistka pro spuštění pytestu odjinud.
testpaths = tests
pythonpath = .

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -q  … stručný výpis
# -ra … na konci vypíše důvody přeskočení (typicky chybějící samples_local/)
# --strict-config … překlep v tomhle souboru je chyba, ne tiché ignorování
addopts = -q -ra --strict-config --showlocals

# Registrované značky. Neznámé značky se nehlásí jako chyba, aby si je mohly
# jednotlivé části projektu doplňovat samy.
markers =
    gui: test potřebuje běžící X server / tkinter (v CI přes xvfb-run)
    slow: pomalejší test (velké dokumenty)

# Test označený xfail, který nečekaně projde, je chyba (test už neplatí).
xfail_strict = true
