# Testy a sestavení Windows aplikace „Generátor dopisů“.
# Zdrojový kód leží v podsložce domain-letter-generator/ — proto má většina
# jobů nastavené `defaults.run.working-directory`.
name: Generátor dopisů

on:
  workflow_dispatch:
    inputs:
      deliver:
        description: >-
          Pushnout hotové .exe do dočasné větve dlg-build-delivery.
          Slouží k převzetí sestavení tam, kde nejsou dostupné artefakty
          Actions. Větev je jednorázová a maže se hned po převzetí.
        type: boolean
        default: false
      cleanup:
        description: >-
          Smazat dočasnou větev dlg-build-delivery. Spouští se samostatně,
          až je sestavení převzaté.
        type: boolean
        default: false
  push:
    branches:
      - main
      - 'claude/**'
    # Pozor: `paths` se u pushnutých tagů nevyhodnocuje, tagy dlg-v* proto
    # workflow spustí vždy (což je záměr — z tagu se dělá release).
    paths:
      - 'domain-letter-generator/**'
      - '.github/workflows/domain-letter-generator.yml'
    tags:
      - 'dlg-v*'

permissions:
  contents: read

concurrency:
  group: domain-letter-generator-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  # --------------------------------------------------------------------------
  test:
    name: Testy (Linux, Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: domain-letter-generator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: domain-letter-generator/requirements-dev.txt

      - name: Vývojové závislosti
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Aplikace nemá runtime závislosti
        # Kontrakt projektu: balík dlg smí sáhnout jen do standardní knihovny.
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import sys

          bad = []
          for path in sorted(pathlib.Path("dlg").rglob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [alias.name.split(".")[0] for alias in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      if node.level:  # relativní import uvnitř balíčku
                          continue
                      names = [(node.module or "").split(".")[0]]
                  else:
                      continue
                  for name in names:
                      if name and name != "dlg" and name not in sys.stdlib_module_names:
                          bad.append(f"{path}:{node.lineno}: {name}")

          if bad:
              print("::error::Balík dlg smí používat jen standardní knihovnu Pythonu.")
              print("\n".join(bad))
              raise SystemExit(1)
          print("OK — dlg importuje jen standardní knihovnu.")
          PY

      - name: Kontrola ikony assets/app.ico
        run: python tools/make_icon.py --check

      - name: Testy
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a python -m pytest -q
          else
            python -m pytest -q
          fi

      - name: Úklid před předáním zdrojáku
        run: |
          find . -name '__pycache__' -type d -prune -exec rm -rf {} +
          rm -rf .pytest_cache

      # Zdroják pro Windows job. Ten se nemůže klonovat sám — viz komentář
      # u jobu `build`.
      - name: Zdrojový kód pro Windows build
        uses: actions/upload-artifact@v4
        with:
          name: dlg-source
          path: domain-letter-generator
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # --------------------------------------------------------------------------
  build:
    name: Windows .exe
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: domain-letter-generator
    steps:
      # Tenhle job se ZÁMĚRNĚ neklonuje. V repozitáři leží soubor
      # migrated_prompt_history/prompt_…T09:40:38.228Z.json a dvojtečka je ve
      # Windows v názvu souboru nepovolená. Git na Windows kontroluje všechny
      # cesty v indexu, takže `git checkout` skončí chybou
      #   error: invalid path '…'
      # bez ohledu na sparse-checkout — vybalit jen část repozitáře nestačí.
      # Zdroják si proto převezmeme jako artefakt z linuxového jobu `test`.
      - name: Zdrojový kód (artefakt z jobu Testy)
        uses: actions/download-artifact@v4
        with:
          name: dlg-source
          path: domain-letter-generator

      - name: Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: domain-letter-generator/requirements-dev.txt

      - name: Aktualizace pipu
        run: python -m pip install --upgrade pip

      - name: Vývojové závislosti (včetně PyInstalleru)
        run: python -m pip install -r requirements-dev.txt

      - name: Kontrola ikony assets/app.ico
        run: python tools/make_icon.py --check

      # Pořadí je záměrné: onedir je varianta, kterou má uživatel spouštět.
      # Onefile při každém startu rozbaluje celý obsah .exe do %TEMP% a čeká
      # na antivirus — proto startuje o vteřiny pomaleji.
      - name: Build — složka (onedir, doporučená varianta)
        env:
          DLG_BUILD_MODE: onedir
        run: python -m PyInstaller --noconfirm --clean --workpath build/onedir --distpath dist DomainLetterGenerator.spec

      - name: Build — jeden soubor (onefile, na flashku)
        env:
          DLG_BUILD_MODE: onefile
        run: python -m PyInstaller --noconfirm --workpath build/onefile --distpath dist DomainLetterGenerator.spec

      - name: Kontrola výsledku
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'dist/GeneratorDopisu.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Chybi $exe" }
          $item = Get-Item -LiteralPath $exe
          Write-Host ("Velikost: {0:N1} MB" -f ($item.Length / 1MB))
          $info = $item.VersionInfo
          Write-Host "ProductName : $($info.ProductName)"
          Write-Host "FileVersion : $($info.FileVersion)"
          if ([string]::IsNullOrWhiteSpace($info.FileVersion)) {
            throw "V .exe chybi version resource."
          }
          $dir = 'dist/GeneratorDopisu-onedir/GeneratorDopisu.exe'
          if (-not (Test-Path -LiteralPath $dir)) { throw "Chybi $dir" }

      - name: Zabalit onedir variantu
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path 'dist/GeneratorDopisu-onedir' -DestinationPath 'dist/GeneratorDopisu-onedir.zip' -Force

      - name: Artefakt — GeneratorDopisu.exe
        uses: actions/upload-artifact@v4
        with:
          name: GeneratorDopisu-exe
          path: domain-letter-generator/dist/GeneratorDopisu.exe
          if-no-files-found: error
          retention-days: 30

      - name: Artefakt — onedir varianta
        uses: actions/upload-artifact@v4
        with:
          name: GeneratorDopisu-onedir
          path: domain-letter-generator/dist/GeneratorDopisu-onedir.zip
          if-no-files-found: error
          retention-days: 30

  # --------------------------------------------------------------------------
  release:
    name: Vydání (GitHub Release)
    needs: build
    if: startsWith(github.ref, 'refs/tags/dlg-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stáhnout artefakty
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Připravit soubory vydání
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/GeneratorDopisu-exe/GeneratorDopisu.exe release/
          cp artifacts/GeneratorDopisu-onedir/GeneratorDopisu-onedir.zip release/
          ls -l release

      - name: Poznámky k vydání
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#dlg-v}"
          cat > release/notes.md <<EOF
          ## Generátor dopisů $version

          **Co stáhnout**

          * \`GeneratorDopisu-onedir.zip\` — **tohle použijte.** Rozbalte celou
            složku a spouštějte \`GeneratorDopisu.exe\` uvnitř ní. Nic se
            neinstaluje a nepotřebuje práva správce. Program naskočí hned.
          * \`GeneratorDopisu.exe\` — celý program v jednom souboru, hodí se na
            flashku. Startuje ale o dost pomaleji: při každém spuštění se celý
            rozbalí do dočasné složky a čeká na antivirovou kontrolu. Ze
            stejného důvodu u něj antivirus častěji hlásí falešný poplach.

          **Kam se ukládají data**

          Šablony a nastavení leží v \`%LOCALAPPDATA%\\DomainLetterGenerator\`.
          Zálohovat stačí tuto složku.

          **Poznámka k antiviru**

          Aplikace není podepsaná certifikátem, takže ji SmartScreen nebo
          antivirus může napoprvé označit za neznámou: *Další informace →
          Přesto spustit*.
          EOF
          cat release/notes.md

      - name: Vytvořit release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Generátor dopisů ${GITHUB_REF_NAME#dlg-v}" \
            --notes-file release/notes.md \
            release/GeneratorDopisu.exe \
            release/GeneratorDopisu-onedir.zip

  # --------------------------------------------------------------------------
  deliver:
    name: Předání .exe do dočasné větve
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deliver }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DELIVERY_BRANCH: dlg-build-delivery
    steps:
      - name: Stáhnout artefakty
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Osiřelý commit v samostatném repozitáři — do historie redline se
      # binárka nedostane. Větev se po převzetí souboru smaže.
      - name: Push do dočasné větve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp artifacts/GeneratorDopisu-exe/GeneratorDopisu.exe delivery/
          cp artifacts/GeneratorDopisu-onedir/GeneratorDopisu-onedir.zip delivery/
          cd delivery
          git init -q -b "$DELIVERY_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Dočasné předání sestavení (běh ${{ github.run_id }})"
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f -q origin "$DELIVERY_BRANCH"
          echo "Předáno do větve $DELIVERY_BRANCH:"
          ls -l

  # --------------------------------------------------------------------------
  cleanup:
    name: Úklid dočasné větve
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cleanup }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Smazat dlg-build-delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q cleanup
          cd cleanup
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin dlg-build-delivery >/dev/null 2>&1; then
            git push -q origin --delete dlg-build-delivery
            echo "Větev dlg-build-delivery smazána."
          else
            echo "Větev dlg-build-delivery neexistuje, není co uklízet."
          fi
