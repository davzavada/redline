name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The whole app inlined into one file, served next to the site so
      # "Stáhnout pro offline" in the settings has something to hand over.
      - name: Build offline copy
        run: |
          npm run build:single
          cp dist-single/index.html dist/redline-offline.html

      # Vite builds to dist/index.html; carry the custom-domain CNAME along.
      - name: Add CNAME
        run: cp CNAME dist/CNAME

      # Publish the built site to the gh-pages branch so Pages can serve it
      # in "Deploy from a branch" mode (Settings -> Pages -> Branch: gh-pages).
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
